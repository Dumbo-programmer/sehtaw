<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✿ Cute Floral AMV ✿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="yt-player" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;"></div>

  <main id="canvas">

    <!-- Background decorations -->
    <div class="layer bg">
      <div class="bg-blob blob1"></div>
      <div class="bg-blob blob2"></div>
      <div class="bg-blob blob3"></div>

      <span class="deco flower" style="top:2%;left:4%;font-size:2.5rem;">🌸</span>
      <span class="deco flower" style="top:7%;left:85%;font-size:1.9rem;">🌷</span>
      <span class="deco flower" style="top:18%;left:1%;font-size:1.6rem;">🌻</span>
      <span class="deco flower" style="top:35%;left:94%;font-size:2.3rem;">🌺</span>
      <span class="deco flower" style="top:48%;left:3%;font-size:1.8rem;">🌼</span>
      <span class="deco flower" style="top:65%;left:91%;font-size:2.1rem;">🌸</span>
      <span class="deco flower" style="top:78%;left:8%;font-size:2.0rem;">💮</span>
      <span class="deco flower" style="top:93%;left:80%;font-size:1.7rem;">🌷</span>
      <span class="deco flower" style="top:12%;left:52%;font-size:1.4rem;">🌹</span>
      <span class="deco flower" style="top:58%;left:46%;font-size:1.9rem;">🌻</span>
      <span class="deco flower" style="top:42%;left:14%;font-size:1.5rem;">🌺</span>
      <span class="deco flower" style="top:72%;left:72%;font-size:1.6rem;">🌸</span>
      <span class="deco flower" style="top:25%;left:78%;font-size:1.3rem;">🌼</span>
      <span class="deco flower" style="top:88%;left:30%;font-size:1.5rem;">🌷</span>

      <span class="deco heart" style="top:4%;left:32%;">💕</span>
      <span class="deco heart" style="top:75%;left:58%;">💖</span>
      <span class="deco heart" style="top:25%;left:82%;">💗</span>
      <span class="deco heart" style="top:85%;left:22%;">💝</span>
      <span class="deco heart" style="top:50%;left:88%;">❤️</span>
      <span class="deco heart" style="top:15%;left:18%;">💘</span>

      <span class="deco sparkle" style="top:14%;left:26%;">✨</span>
      <span class="deco sparkle" style="top:46%;left:8%;">⭐</span>
      <span class="deco sparkle" style="top:90%;left:48%;">✨</span>
      <span class="deco sparkle" style="top:30%;left:58%;">🌟</span>
      <span class="deco sparkle" style="top:52%;left:70%;">✨</span>
      <span class="deco sparkle" style="top:8%;left:72%;">✧</span>
      <span class="deco sparkle" style="top:68%;left:15%;">✦</span>
      <span class="deco sparkle" style="top:38%;left:40%;">✧</span>

      <span class="deco bunny" style="top:10%;left:62%;">🐰</span>
      <span class="deco bunny" style="top:68%;right:12%;">🐰</span>
      <span class="deco seal" style="top:76%;left:35%;">🦭</span>
      <span class="deco cloud" style="top:5%;right:6%;">☁️</span>
      <span class="deco cloud" style="top:18%;left:74%;">☁️</span>
      <span class="deco moon" style="top:2%;right:30%;">🌙</span>
    </div>

    <!-- Love scribbles -->
    <div class="layer scribbles-layer">
      <span class="scribble sc-1">♡ love always ♡</span>
      <span class="scribble sc-2">xoxo</span>
      <span class="scribble sc-3">you're my everything</span>
      <span class="scribble sc-4">sweetie ✿</span>
      <span class="scribble sc-5">♡ forever ♡</span>
      <span class="scribble sc-6">be mine</span>
      <span class="scribble sc-7">i luv u</span>
      <span class="scribble sc-8">♡</span>
    </div>

    <!-- Images layer -->
    <div class="layer images">
      <div class="orbit-container">
        <div class="polaroid orbit-img decoration img-1" style="background-image:url('scene1.jpg')">
          <span class="caption">✿ my everything ✿</span>
        </div>
        <div class="polaroid orbit-img petal img-2" style="background-image:url('scene2.jpg')">
          <span class="caption">you &amp; me</span>
        </div>
        <div class="polaroid orbit-img petal img-3" style="background-image:url('scene3.jpg')">
          <span class="caption">always</span>
        </div>
        <div class="polaroid orbit-img petal img-4" style="background-image:url('scene4.jpg')">
          <span class="caption">forever</span>
        </div>
        <div class="polaroid orbit-img petal img-5" style="background-image:url('scene5.jpg')">
          <span class="caption">sweetheart</span>
        </div>
        <div class="polaroid orbit-img petal img-6" style="background-image:url('scene6.jpg')">
          <span class="caption">moonlight</span>
        </div>
        <div class="polaroid orbit-img decoration img-7" style="background-image:url('scene7.jpg')">
          <span class="caption">my love ✿</span>
        </div>
      </div>
    </div>

    <!-- Stickers -->
    <div class="layer stickers">
      <span class="sticker st-1">🎀</span>
      <span class="sticker st-2">🍓</span>
      <span class="sticker st-3">🌸</span>
      <span class="sticker st-4">🦋</span>
      <span class="sticker st-5">🍭</span>
      <span class="sticker st-6">🧁</span>
      <span class="sticker st-7">🐰</span>
      <span class="sticker st-8">🦭</span>
    </div>

    <!-- Heart ring for finale -->
    <div class="layer heart-ring-layer">
      <div class="heart-ring">
        <span class="ring-heart">💕</span>
        <span class="ring-heart">💖</span>
        <span class="ring-heart">💗</span>
        <span class="ring-heart">💝</span>
        <span class="ring-heart">❤️</span>
        <span class="ring-heart">💕</span>
        <span class="ring-heart">💖</span>
        <span class="ring-heart">💗</span>
        <span class="ring-heart">💝</span>
        <span class="ring-heart">❤️</span>
        <span class="ring-heart">💕</span>
        <span class="ring-heart">💖</span>
      </div>
    </div>

    <!-- Sparkle burst for finale -->
    
    <div class="layer lyrics">
      <h1 class="lyric-line" style="opacity:0;">♡</h1>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
